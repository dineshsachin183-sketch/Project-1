<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101323">
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f8f7ff; background: #101323; }
    body::before, body::after { content: ""; position: fixed; width: 38rem; height: 38rem; border-radius: 50%; filter: blur(100px); opacity: .28; pointer-events: none; }
    body::before { background: #7457ff; top: -20rem; left: -12rem; }
    body::after { background: #00d9c5; bottom: -24rem; right: -12rem; }
    .card { position: relative; width: min(90vw, 720px); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid rgba(255,255,255,.15); border-radius: 30px; background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)); box-shadow: 0 30px 100px rgba(0,0,0,.38); backdrop-filter: blur(18px); animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 1.5rem; border-radius: 20px; font-size: 1.8rem; background: linear-gradient(135deg, #a78bfa, #5eead4); box-shadow: 0 8px 30px rgba(125,100,255,.35); }
    .eyebrow { margin: 0 0 .8rem; color: #a9a9c3; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 6.2rem); line-height: 1; letter-spacing: -.07em; background: linear-gradient(100deg, #fff 20%, #c4b5fd 55%, #5eead4); color: transparent; background-clip: text; }
    .subtitle { margin: 1.5rem auto 2rem; max-width: 34rem; color: #c4c5d6; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    button { border: 0; border-radius: 999px; padding: .9rem 1.35rem; color: #111323; background: linear-gradient(100deg, #c4b5fd, #5eead4); font: inherit; font-weight: 750; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; box-shadow: 0 8px 26px rgba(94,234,212,.2); }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(94,234,212,.35); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #message { min-height: 1.5em; margin: 1rem 0 0; color: #a9a9c3; font-size: .9rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello, World!</h1>
    <p class="subtitle">Your next great idea starts here. A simple hello, dressed up with a little color and a little magic.</p>
    <button id="helloButton" type="button">Say hello <span aria-hidden="true">→</span></button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector('#helloButton');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back at you! ✨';
      button.innerHTML = 'Hello! <span aria-hidden="true">✓</span>';
    });
  </script>
</body>
</html>
